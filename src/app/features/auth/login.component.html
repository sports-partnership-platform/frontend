<div class="min-h-screen w-full flex items-center justify-center p-4 bg-[#06090e] relative overflow-hidden">
  <!-- Background Glow & Grid Orbs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-indigo-600/15 blur-[120px] pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-cyan-600/15 blur-[120px] pointer-events-none">
  </div>

  <div class="w-full max-w-md relative z-10 space-y-8 animate-in fade-in zoom-in-95 duration-300">
    <!-- Brand Header -->
    <div class="text-center space-y-3">
      <!-- <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-cyan-500 shadow-xl shadow-indigo-500/25 border border-white/20">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div> -->
      <div>
        <h1 class="text-2xl font-black font-heading tracking-tight text-white">SPORTS PARTNERSHIP</h1>
        <p class="text-xs font-medium text-slate-400 mt-1">Multi-Tier Hierarchy & Commission Settlement Portal</p>
      </div>
    </div>

    <!-- Login Glass Panel -->
    <div class="glass-panel p-8 space-y-6 shadow-2xl border border-white/[0.12] bg-[#0c121e]/90 backdrop-blur-xl">
      <div class="border-b border-white/[0.08] pb-4">
        <h2 class="text-lg font-bold font-heading text-white flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          Account Sign In
        </h2>
        <p class="text-xs text-slate-400 mt-0.5">Enter your network partner credentials to access your portal</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage"
        class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2.5 animate-in fade-in">
        <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-300 mb-1.5">Username / Partner ID</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input type="text" [(ngModel)]="username" name="username" placeholder="e.g. admin or rahul" required
              class="form-input pl-10 text-xs font-mono" />
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••••••" required
              class="form-input pl-10 pr-10 text-xs font-mono" />
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
              [title]="showPassword ? 'Hide password' : 'Show password'"
              aria-label="Toggle password visibility">
              <!-- Eye Icon (Show password) -->
              <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Slash Icon (Hide password) -->
              <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="loading"
          class="btn-primary w-full justify-center py-3 text-xs font-bold tracking-wide mt-2">
          <span *ngIf="loading" class="flex items-center gap-2">
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <span>Authenticating...</span>
          </span>
          <span *ngIf="!loading" class="flex items-center gap-2">
            <span>Access Network Portal</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </span>
        </button>
      </form>

      <!-- Quick Demo Credentials Section -->
      <div class="pt-4 border-t border-white/[0.08] space-y-3">
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Quick Demo Credentials
        </p>

        <div class="grid grid-cols-1 gap-2">
          <button type="button" (click)="quickFill('admin', 'admin123')"
            class="p-2.5 rounded-lg bg-[#121929] border border-amber-500/30 hover:border-amber-500/60 transition-all text-left flex items-center justify-between group">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span>
              <span class="font-bold text-white text-xs">Platform Owner (Root)</span>
            </div>
            <span class="font-mono text-[11px] text-amber-300 group-hover:text-amber-200">admin / admin123</span>
          </button>
        </div>
        <p class="text-[10px] text-slate-500 text-center">Once downline partners are onboarded, you can log in using
          their created usernames.</p>
      </div>
    </div>
  </div>
</div>
